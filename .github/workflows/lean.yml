name: Lean proof
on:
  push:
    branches: [master, lean-proof]
    paths: ['**.lean', 'lean-toolchain', 'lakefile.toml', 'lake-manifest.json', '.github/workflows/lean.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned mathlib and compiled cache
        run: |
          lake update
          lake exe cache get
      - name: Reject proof gaps and trusted native shortcuts
        run: |
          if grep -R -nE '\b(sorry|admit|axiom|native_decide)\b' --include='*.lean' SubsetSum SubsetSum.lean Audit.lean; then
            echo 'Unproved declaration or native shortcut found.' >&2
            exit 1
          fi
      - name: Kernel-check all proof files
        run: |
          set -o pipefail
          lake build 2>&1 | tee lean-build.log
          lake env lean Audit.lean 2>&1 | tee lean-axioms.log
      - name: Recheck independent Python certificates
        run: python3 verify.py
