name: Isolation proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Lean toolchain
        run: |
          curl --retry 3 -sSf https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned mathlib
        run: |
          lake update || lake update
          lake exe cache get
      - name: Check all proofs and dependencies
        run: |
          set -o pipefail
          lake build 2>&1 | tee lean-build.log
          lake env lean Audit.lean
          python3 verify.py
      - name: Reject unfinished proof declarations
        run: |
          if grep -R -nE '\b(sorry|admit|axiom|native_decide)\b' --include='*.lean' SubsetSum SubsetSum.lean Audit.lean; then exit 1; fi
